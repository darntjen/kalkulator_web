name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, Tests und Paket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore Kalkulator.slnx

      - name: Code-Stil prüfen
        run: dotnet format Kalkulator.slnx --verify-no-changes --no-restore

      - name: Build (Warnungen sind Fehler)
        run: dotnet build Kalkulator.slnx -c Release --no-restore

      - name: Tests
        run: dotnet test Kalkulator.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testergebnisse
          path: TestResults

      - name: Veröffentlichungspaket für IIS erstellen
        run: dotnet publish src/Kalkulator.Web/Kalkulator.Web.csproj -c Release --no-build -o publish

      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: kalkulator-web
          path: publish
